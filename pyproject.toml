[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # long lines are reported by the formatter, not the linter
    "SIM108", # ternaries are not always clearer than if/else
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # import tender_pipeline from the repo, however pytest is launched
addopts = "-q"

[tool.mypy]
python_version = "3.12"
files = ["tender_pipeline", "tender_search"]
check_untyped_defs = true
warn_unused_ignores = true
