services:
  db:
    # Postgres 16 with the pgvector extension, for semantic search.
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: tender
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tender}
      POSTGRES_DB: tenders
    ports:
      # Localhost only, and 5433 so it never collides with a locally installed Postgres.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender -d tenders"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # A run-to-completion job, not a server: `docker compose run --rm pipeline <command>`.
  pipeline:
    build: .
    profiles: ["job"]
    environment:
      DATABASE_URL: postgresql://tender:${POSTGRES_PASSWORD:-tender}@db:5432/tenders
      REQUEST_DELAY_SECONDS: ${REQUEST_DELAY_SECONDS:-1.0}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy

  # The search API and page on http://127.0.0.1:8000. Also runs the embedding
  # job: `docker compose run --rm api embed`.
  api:
    build:
      context: .
      dockerfile: Dockerfile.search
    environment:
      DATABASE_URL: postgresql://tender:${POSTGRES_PASSWORD:-tender}@db:5432/tenders
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
