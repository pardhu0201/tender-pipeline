name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests (with PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tender
          POSTGRES_PASSWORD: tender
          POSTGRES_DB: tenders_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tender -d tenders_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The suite never touches the network: GeM responses come from fixtures.
      TEST_DATABASE_URL: postgresql://tender:tender@localhost:5432/tenders_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests (coverage must stay at or above 95%)
        run: pytest -rs --cov=tender_pipeline --cov-report=term-missing --cov-fail-under=95

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tender-pipeline:ci
