name: Live smoke test

# Manual only. GeM's API is undocumented and can change without notice; this
# crawls two real pages into a throwaway database to check the client still
# understands it. Run it from the Actions tab before relying on a deploy.
on:
  workflow_dispatch:

jobs:
  smoke:
    name: Crawl two live pages from GeM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tender
          POSTGRES_PASSWORD: tender
          POSTGRES_DB: tenders
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tender -d tenders"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tender:tender@localhost:5432/tenders
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt
      - run: python -m tender_pipeline init-db
      - run: python -m tender_pipeline run --mode full --max-pages 2
      - run: python -m tender_pipeline status
      - run: python -m tender_pipeline report
